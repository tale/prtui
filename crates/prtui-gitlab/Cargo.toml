[package]
name = "prtui-gitlab"
version.workspace = true
edition.workspace = true
description = "GitLab provider for prtui"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["gitlab", "code-review", "provider", "tui"]
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
prtui-core = { version = "0.3.0", path = "../prtui-core" }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "process", "rt"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json"] }
