name: prtui
arch: ${PRTUI_PACKAGE_ARCH}
platform: linux
version: ${PRTUI_VERSION}
maintainer: Aarnav Tale <git@tale.me>
description: Terminal UI for reviewing GitHub pull requests and GitLab merge requests
homepage: https://github.com/tale/prtui
license: MIT
section: devel
depends:
  - git
suggests:
  - gh
  - glab
contents:
  - src: target/package/prtui
    dst: /usr/bin/prtui
  - src: README.md
    dst: /usr/share/doc/prtui/README.md
  - src: LICENSE
    dst: /usr/share/doc/prtui/copyright
