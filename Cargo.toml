[package]
name = "prtui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
futures-core = { version = "0.3.31", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["layout-cache", "termina"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
termina = { version = "0.3.3", features = ["event-stream"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"
