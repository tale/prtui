[package]
name = "prtui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
edtui = "0.11.6"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "sync"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
edtui = "0.11.6"
