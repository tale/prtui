[package]
name = "prtui"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for reviewing GitHub pull requests"
license = "MIT"
repository = "https://github.com/tale/prtui"
homepage = "https://github.com/tale/prtui"
documentation = "https://github.com/tale/prtui"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["github", "pull-request", "review", "tui"]
exclude = ["/.github", "/.changeset", "/ARCHITECTURE.md", "/docs", "/flake.lock", "/flake.nix", "/knope.toml", "/lefthook.yml", "/mise.toml"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
option_if_let_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unreadable_literal = "allow"
too_many_lines = "allow"
future_not_send = "allow"
multiple_crate_versions = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
devicons = "0.6.13"
futures-core = { version = "0.3.31", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["layout-cache", "termina"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
termina = { version = "0.3.3", features = ["event-stream"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json"] }
