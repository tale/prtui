name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag that disagrees with the manifest ships a binary whose --version names
  # a release nobody can find. Its own job so a mismatch fails once.
  verify:
    name: Check the tag matches the manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare
        run: |
          tagged=${GITHUB_REF_NAME#v}
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$manifest" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml $manifest" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            package_arch: arm64
            nfpm_arch: arm64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            package_arch: amd64
            nfpm_arch: x86_64
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show && rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.package_arch
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C relocation-model=static
          CC_aarch64_unknown_linux_musl: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: PRTUI_VERSION="${GITHUB_REF_NAME#v}" cargo build --release --locked -p prtui --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="prtui-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/prtui README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Install nFPM
        if: matrix.package_arch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory=$(mktemp -d)
          archive="nfpm_2.47.0_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          gh release download v2.47.0 --repo goreleaser/nfpm \
            --pattern "$archive" --pattern checksums.txt --dir "$directory"
          cd "$directory"
          awk -v archive="$archive" '$2 == archive' checksums.txt > selected.sha256
          sha256sum --check selected.sha256
          tar xzf "$archive" nfpm
          echo "$directory" >> "$GITHUB_PATH"

      - name: Package Linux installers
        if: matrix.package_arch
        env:
          PRTUI_PACKAGE_ARCH: ${{ matrix.package_arch }}
          PRTUI_BINARY: target/${{ matrix.target }}/release/prtui
        run: |
          export PRTUI_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p target/package
          cp "$PRTUI_BINARY" target/package/prtui
          for format in deb rpm; do
            package="prtui-${GITHUB_REF_NAME}-${{ matrix.package_arch }}.$format"
            nfpm package --config packaging/nfpm.yaml --packager "$format" --target "$package"
            sha256sum "$package" > "$package.sha256"
          done

      - name: Test Linux installations
        if: matrix.package_arch
        run: |
          binary="$PWD/target/${{ matrix.target }}/release/prtui"
          expected="prtui ${GITHUB_REF_NAME#v}"
          if readelf -l "$binary" | grep -q INTERP; then
            echo "Linux portable binary requires a dynamic loader" >&2
            exit 1
          fi
          test "$("$binary" --version)" = "$expected"
          docker run --rm --network none -v "$binary:/usr/bin/prtui:ro" alpine:3.23 \
            sh -ec 'test "$(prtui --version)" = "$1"' sh "$expected"
          sudo apt-get install -y ./prtui-"$GITHUB_REF_NAME"-${{ matrix.package_arch }}.deb
          test "$(prtui --version)" = "$expected"
          docker run --rm -v "$PWD:/packages:ro" fedora:43 sh -ec \
            'dnf install -y /packages/"$1" && test "$(prtui --version)" = "$2" && ! command -v gh && ! command -v glab' \
            sh "prtui-$GITHUB_REF_NAME-${{ matrix.package_arch }}.rpm" "$expected"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prtui-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.deb
            *.deb.sha256
            *.rpm
            *.rpm.sha256
          retention-days: 1

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # knope wrote this section from the changesets; lifting it verbatim is
      # what keeps the release notes and the file the same words.
      - name: Lift the release notes out of the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            artifacts/*

  # The tap regenerates its formula from whatever the newest release published,
  # so this has to follow `release` rather than `build`: dispatching earlier
  # points the generator at assets that are not attached yet.
  tap:
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Scoped to the tap alone and minted per run, so the only standing secret
      # is the app key rather than a token that can reach anything it owns.
      - name: Mint a token for the tap
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: "Iv23liki4UCydzX0wo2N"
          private-key: ${{ secrets.TALE_APP_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Dispatch the formula update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run update-prtui.yml --repo tale/homebrew-tap

  # Trusted publishing: the token is minted per-run over OIDC and expires in
  # 30 minutes, so no long-lived credential lives in the repository. crates.io
  # matches the claim against the workflow filename, which is this file.
  crate:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup show
      - name: Mint a publish token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked -p prtui-core
          cargo publish --locked -p prtui-github
          cargo publish --locked -p prtui-gitlab
          cargo publish --locked -p prtui-tui
          cargo publish --locked -p prtui
