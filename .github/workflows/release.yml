name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    name: Determine release version
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve version
        id: version
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "tag=head" >> "$GITHUB_OUTPUT"
            echo "version=$manifest-head.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          if [ "$manifest" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml $manifest" >&2
            exit 1
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    env:
      PRTUI_TAG: ${{ needs.verify.outputs.tag }}
      PRTUI_VERSION: ${{ needs.verify.outputs.version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show && rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C relocation-model=static
          CC_aarch64_unknown_linux_musl: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p prtui --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="prtui-${PRTUI_TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/prtui README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Test portable Linux binaries
        if: endsWith(matrix.target, '-musl')
        run: |
          binary="$PWD/target/${{ matrix.target }}/release/prtui"
          expected="prtui $PRTUI_VERSION"
          if readelf -l "$binary" | grep -q INTERP; then
            echo "Linux portable binary requires a dynamic loader" >&2
            exit 1
          fi
          test "$("$binary" --version)" = "$expected"
          docker run --rm --network none -v "$binary:/usr/bin/prtui:ro" alpine:3.23 \
            sh -ec 'test "$(prtui --version)" = "$1"' sh "$expected"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prtui-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          retention-days: 1

  release:
    name: Publish the GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # knope wrote this section from the changesets; lifting it verbatim is
      # what keeps the release notes and the file the same words.
      - name: Lift the release notes out of the changelog
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            artifacts/*

      - name: Update head release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Built from $GITHUB_SHA on main."
          if ! gh release view head >/dev/null 2>&1; then
            gh release create head --prerelease --latest=false \
              --target "$GITHUB_SHA" --title HEAD --notes "$notes"
          fi
          gh release upload head artifacts/* --clobber
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/head" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit head --prerelease --latest=false --notes "$notes"

  # The tap regenerates its formula from whatever the newest release published,
  # so this has to follow `release` rather than `build`: dispatching earlier
  # points the generator at assets that are not attached yet.
  tap:
    if: github.ref_type == 'tag'
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Scoped to the tap alone and minted per run, so the only standing secret
      # is the app key rather than a token that can reach anything it owns.
      - name: Mint a token for the tap
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: "Iv23liki4UCydzX0wo2N"
          private-key: ${{ secrets.TALE_APP_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Dispatch the formula update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run update-prtui.yml --repo tale/homebrew-tap

  crate:
    if: github.ref_type == 'tag'
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup show
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p prtui-core
          cargo publish --locked -p prtui-github
          cargo publish --locked -p prtui-gitlab
          cargo publish --locked -p prtui-tui
          cargo publish --locked -p prtui
